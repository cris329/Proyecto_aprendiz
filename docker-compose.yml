services:
  mysql:
    image: mysql:8.4
    container_name: aprendiz-mysql
    environment:
      MYSQL_DATABASE: aprendiz
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./Aprendiz/proyecto
    container_name: aprendiz-backend
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./front_adso-main
    container_name: aprendiz-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
